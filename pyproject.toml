[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldshift"
version = "1.0.0"
description = "Farmer-friendly crop-rotation comparison powered by NASA Earth observations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aditya", email = "developer@fieldshift.local" }
]
keywords = [
    "nasa",
    "earth-observation",
    "agriculture",
    "agronomy",
    "crop-rotation",
    "soil-conservation",
    "groundwater",
    "kansas"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent"
]

[project.scripts]
fieldshift = "fieldshift.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests"
]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
